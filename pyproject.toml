[project]
name = "pgraph-python"
version = "0.6.4"
authors = [{ name = "Peter Corke", email = "rvc@petercorke.com" }]
description = "Mathematical graphs for Python"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    # Indicate who your project is intended for
    "Intended Audience :: Developers",
    # Specify the Python versions you support here.
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = [
    "python",
    "graph",
    "directed graph",
    "undirected graph",
    "a* search",
    "adjacency matrix",
    "Laplacian matrix",
    "plotting",
    "optimal path",
]

dependencies = ["spatialmath-python", "numpy>=2.0", "scipy", "matplotlib"]

[project.urls]

"Homepage" = "https://github.com/petercorke/pgraph-python"
"Bug Tracker" = "https://github.com/petercorke/pgraph-python/issues"
"Documentation" = "https://petercorke.github.io/pgraph-python"
"GitHub Source" = "https://github.com/petercorke/pgraph-python"
"Changelog" = "https://github.com/petercorke/pgraph-python/blob/main/CHANGELOG.md"
"Coverage" = "https://codecov.io/gh/petercorke/pgraph-python"

[project.optional-dependencies]

dev = ["pytest", "pytest-cov", "mypy"]

docs = [
    "sphinx",
    "recommonmark",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx-pyrunblock",
    "sphinx-codeautolink",
]

[tool.pytest.ini_options]
pythonpath = ["src"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgraph"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.coverage.run]
omit = []

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
